<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Championship Standings — Apex &amp; Chill Racing League</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --cyan:    #00d4ff;
      --purple:  #b400ff;
      --magenta: #ff00c8;
      --gold:    #ffd700;
      --silver:  #b8c0cc;
      --bronze:  #cd7f32;
      --green:   #00ff88;
      --red:     #ff4455;
      --panel:   rgba(8, 8, 24, 0.98);
      --text:    #eaeaf5;
      --dim:     #556688;
      --row-alt: rgba(255,255,255,0.025);
      --border:  rgba(255,255,255,0.06);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
      font-family: 'Rajdhani', 'Arial', sans-serif;
    }

    /* ── SHELL ── */
    #overlay {
      position: absolute;
      inset: 28px;
      background: var(--panel);
      border-radius: 14px;
      border: 1px solid rgba(0, 212, 255, 0.2);
      box-shadow:
        0 0 90px rgba(0, 180, 255, 0.08),
        0 0 180px rgba(180, 0, 255, 0.04),
        inset 0 1px 0 rgba(255,255,255,0.04);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    #hdr {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 52px;
      height: 112px;
      flex-shrink: 0;
      background: linear-gradient(90deg,
        rgba(0,212,255,0.07) 0%,
        rgba(180,0,255,0.03) 50%,
        rgba(255,0,200,0.07) 100%);
      border-bottom: 1px solid var(--border);
      position: relative;
    }

    #hdr::after {
      content: '';
      position: absolute;
      bottom: 0; left: 4%; right: 4%;
      height: 2px;
      background: linear-gradient(90deg,
        transparent, var(--cyan) 20%,
        var(--purple) 50%, var(--magenta) 80%, transparent);
      opacity: 0.55;
    }

    .brand-name {
      font-family: 'Orbitron', monospace;
      font-weight: 900;
      font-size: 27px;
      letter-spacing: 4px;
      background: linear-gradient(135deg, var(--cyan) 0%, var(--purple) 55%, var(--magenta) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-transform: uppercase;
    }

    .brand-sub {
      font-size: 12px;
      font-weight: 600;
      color: var(--dim);
      letter-spacing: 5px;
      text-transform: uppercase;
      margin-top: 5px;
    }

    .hdr-center { text-align: center; }

    .hdr-title {
      font-family: 'Orbitron', monospace;
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 7px;
      text-transform: uppercase;
    }

    .hdr-season {
      font-size: 13px;
      color: var(--dim);
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-top: 6px;
    }

    .hdr-right {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
    }

    .class-tag {
      padding: 9px 24px;
      border-radius: 25px;
      font-family: 'Orbitron', monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      border: 2px solid transparent;
      transition: all 0.6s ease;
      opacity: 0.3;
    }

    .class-tag.gt3      { color: var(--green); border-color: var(--green); }
    .class-tag.hypercar { color: var(--red);   border-color: var(--red); }

    .class-tag.active { opacity: 1; }
    .class-tag.active.gt3      { background: rgba(0,255,136,0.12); box-shadow: 0 0 20px rgba(0,255,136,0.22); }
    .class-tag.active.hypercar { background: rgba(255,68,85,0.12);  box-shadow: 0 0 20px rgba(255,68,85,0.22); }

    /* ── COLUMN HEADERS ── */
    #col-hdrs {
      display: grid;
      grid-template-columns: 76px 76px 1fr 300px 90px 90px 90px 112px;
      padding: 0 52px;
      height: 40px;
      align-items: center;
      flex-shrink: 0;
      background: rgba(0, 180, 255, 0.035);
      border-bottom: 1px solid var(--border);
    }

    .ch {
      font-family: 'Orbitron', monospace;
      font-size: 10px;
      font-weight: 700;
      color: var(--dim);
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    .ch.c { text-align: center; }
    .ch.r { text-align: right; }

    /* ── TABLE BODY ── */
    #tbl-wrap {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    #tbl-wrap::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 72px;
      background: linear-gradient(transparent, rgba(8,8,24,0.75));
      pointer-events: none;
      z-index: 2;
    }

    #tbl-body {
      position: absolute;
      top: 0; left: 0; right: 0;
      will-change: transform;
      transition: transform 0.75s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    /* ── DRIVER ROW ── */
    .row {
      display: grid;
      grid-template-columns: 76px 76px 1fr 300px 90px 90px 90px 112px;
      padding: 0 52px;
      height: 63px;
      align-items: center;
      border-bottom: 1px solid var(--border);
      position: relative;
    }

    .row::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
    }

    .row:nth-child(even) { background: var(--row-alt); }

    .row.p1 { background: rgba(255,215,0,0.055) !important; }
    .row.p2 { background: rgba(192,192,192,0.035) !important; }
    .row.p3 { background: rgba(205,127,50,0.035) !important; }

    .row.p1::before { background: var(--gold); }
    .row.p2::before { background: var(--silver); }
    .row.p3::before { background: rgba(205,127,50,0.9); }

    /* position badge */
    .pos-num {
      width: 42px; height: 42px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Orbitron', monospace;
      font-weight: 900;
      font-size: 17px;
      color: var(--text);
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.09);
    }
    .pos-num.g { background: rgba(255,215,0,0.18); border-color: rgba(255,215,0,0.42); color: var(--gold); }
    .pos-num.s { background: rgba(192,192,192,0.14); border-color: rgba(192,192,192,0.38); color: var(--silver); }
    .pos-num.b { background: rgba(205,127,50,0.14); border-color: rgba(205,127,50,0.38); color: var(--bronze); }

    /* car number */
    .car-num {
      min-width: 50px; height: 33px;
      padding: 0 8px;
      border-radius: 5px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: 'Orbitron', monospace;
      font-weight: 700;
      font-size: 14px;
      background: rgba(0,212,255,0.08);
      border: 1px solid rgba(0,212,255,0.24);
      color: var(--cyan);
    }

    /* driver name */
    .driver-name {
      font-size: 21px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding-right: 14px;
    }

    /* car name */
    .car-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding-right: 14px;
    }

    /* race points cell */
    .rpt {
      text-align: center;
      font-family: 'Orbitron', monospace;
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }
    .rpt.win    { color: var(--gold); }
    .rpt.podium { color: var(--silver); }
    .rpt.zero   { color: #3a3a58; }
    .rpt.dns    { font-size: 11px; letter-spacing: 1.5px; color: #445; font-weight: 600; }
    .rpt.dnf    { font-size: 11px; letter-spacing: 1.5px; color: #883333; font-weight: 600; }
    .rpt.none   { color: #2a2a3e; font-size: 20px; font-weight: 300; }

    /* points column */
    .pts-val {
      font-family: 'Orbitron', monospace;
      font-size: 22px;
      font-weight: 900;
      color: var(--text);
      text-align: right;
      line-height: 1;
    }
    .pts-lbl {
      font-size: 11px;
      color: var(--dim);
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: right;
    }
    .row.p1 .pts-val { color: var(--gold); }
    .row.p2 .pts-val { color: var(--silver); }
    .row.p3 .pts-val { color: var(--bronze); }

    /* ── FOOTER ── */
    #footer {
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 52px;
      flex-shrink: 0;
      background: rgba(0,0,0,0.22);
      border-top: 1px solid var(--border);
    }

    .footer-brand {
      font-size: 12px;
      font-weight: 600;
      color: var(--dim);
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .footer-info {
      font-family: 'Orbitron', monospace;
      font-size: 11px;
      color: var(--dim);
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    /* ── TRANSITION VEIL ── */
    #veil {
      position: absolute;
      inset: 0;
      background: var(--panel);
      opacity: 0;
      pointer-events: none;
      z-index: 50;
      transition: opacity 0.35s ease;
    }
    #veil.show { opacity: 1; }

    /* ── PROGRESS BAR ── */
    #progress-bar {
      position: absolute;
      bottom: 46px;
      left: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--cyan), var(--purple));
      z-index: 3;
      transition: width 0.3s linear;
      opacity: 0.5;
    }
  </style>
</head>

        { position:5,  id:"Antonis Paparinopoulos",  carNum:12,  car:"Ferrari 499P",          championshipPoints:21, races:[{position:null,pointsTotal:null,dnf:null,dns:null},{position:3,pointsTotal:21,dnf:false,dns:false},{position:null,pointsTotal:null,dnf:null,dns:null}] },
        { position:6,  id:"Tudor Debu",              carNum:17,  car:"Peugeot 9X8 2024",     championshipPoints:21, races:[{position:null,pointsTotal:null,dnf:null,dns:null},{position:null,pointsTotal:null,dnf:null,dns:null},{position:3,pointsTotal:21,dnf:false,dns:false}] },
        { position:7,  id:"Ben Nytes",               carNum:66,  car:"Peugeot 9X8",           championshipPoints:19, races:[{position:null,pointsTotal:null,dnf:null,dns:null},{position:4,pointsTotal:19,dnf:false,dns:false},{position:7,pointsTotal:0,dnf:false,dns:true}] },
        { position:8,  id:"Dalton Stevens",          carNum:321, car:"Peugeot 9X8 2024",     championshipPoints:19, races:[{position:null,pointsTotal:null,dnf:null,dns:null},{position:null,pointsTotal:null,dnf:null,dns:null},{position:4,pointsTotal:19,dnf:false,dns:false}] },
        { position:9,  id:"Alex O'Reilly",           carNum:13,  car:"Porsche 963",           championshipPoints:17, races:[{position:null,pointsTotal:null,dnf:null,dns:null},{position:5,pointsTotal:17,dnf:false,dns:false},{position:8,pointsTotal:0,dnf:false,dns:true}] },
        { position:10, id:"Fabian Egger",            carNum:63,  car:"Ferrari 499P",          championshipPoints:0,  races:[{position:null,pointsTotal:null,dnf:null,dns:null},{position:6,pointsTotal:0,dnf:false,dns:true},{position:6,pointsTotal:0,dnf:false,dns:true}] },
        { position:11, id:"Szanto Mate",             carNum:15,  car:"Porsche 963",           championshipPoints:0,  races:[{position:null,pointsTotal:null,dnf:null,dns:null},{position:null,pointsTotal:null,dnf:null,dns:null},{position:null,pointsTotal:null,dnf:null,dns:null}] }
      ]
    }
  ];

  // ════════════════════════════════════════════════════════
  //  CONFIG  (tweak these to suit your broadcast)
  // ════════════════════════════════════════════════════════
  const ROW_H          = 63;    // px — must match CSS .row height
  const SCROLL_DELAY   = 2400;  // ms between each row-scroll step
  const BOTTOM_PAUSE   = 4500;  // ms pause after reaching last row
  const SWITCH_ANIM    = 380;   // ms for veil fade duration

  // ════════════════════════════════════════════════════════
  //  STATE
  // ════════════════════════════════════════════════════════
  let classIdx   = 0;
  let scrollPos  = 0;
  let timer      = null;
  let progTimer  = null;

  // ════════════════════════════════════════════════════════
  //  HELPERS
  // ════════════════════════════════════════════════════════
  function raceCell(r) {
    if (!r || (r.position === null && r.dnf === null && r.dns === null)) {
      return '<div class="rpt none">–</div>';
    }
    if (r.dns)  return '<div class="rpt dns">DNS</div>';
    if (r.dnf)  return '<div class="rpt dnf">DNF</div>';
    const pts = r.pointsTotal ?? 0;
    if (pts === 0) return '<div class="rpt zero">0</div>';
    const cls = pts >= 25 ? 'win' : (pts >= 21 ? 'podium' : '');
    return `<div class="rpt ${cls}">${Math.round(pts)}</div>`;
  }

  function posClass(p)    { return p===1?'p1':p===2?'p2':p===3?'p3':''; }
  function posNumCls(p)   { return p===1?'g':p===2?'s':p===3?'b':''; }

  // ════════════════════════════════════════════════════════
  //  RENDER
  // ════════════════════════════════════════════════════════
  function buildRows(list) {
    return list.map(d => {
      const r = d.races || [];
      return `
        <div class="row ${posClass(d.position)}">
          <div><div class="pos-num ${posNumCls(d.position)}">${d.position}</div></div>
          <div><div class="car-num">${d.carNum}</div></div>
          <div class="driver-name">${d.id}</div>
          <div class="car-name">${(d.car||'').trim()}</div>
          ${raceCell(r[0])}
          ${raceCell(r[1])}
          ${raceCell(r[2])}
          <div>
            <div class="pts-val">${d.championshipPoints}</div>
            <div class="pts-lbl">pts</div>
          </div>
        </div>`;
    }).join('');
  }

  // ════════════════════════════════════════════════════════
  //  SCROLL LOGIC
  // ════════════════════════════════════════════════════════
  function startScroll(totalRows) {
    clearTimeout(timer);
    clearInterval(progTimer);

    const wrapH   = document.getElementById('tbl-wrap').clientHeight;
    const visible = Math.floor(wrapH / ROW_H);
    const maxStep = Math.max(0, totalRows - visible);
    const progBar = document.getElementById('progress-bar');

    // Animate progress bar across entire display duration
    const totalMs = maxStep * SCROLL_DELAY + BOTTOM_PAUSE + SCROLL_DELAY;
    let elapsed   = 0;
    progBar.style.transition = 'none';
    progBar.style.width = '0%';
    requestAnimationFrame(() => {
      progBar.style.transition = `width ${totalMs}ms linear`;
      progBar.style.width = '100%';
    });

    function step() {
      if (scrollPos < maxStep) {
        scrollPos++;
        document.getElementById('tbl-body').style.transform =
          `translateY(-${scrollPos * ROW_H}px)`;
        timer = setTimeout(step, SCROLL_DELAY);
      } else {
        timer = setTimeout(switchClass, BOTTOM_PAUSE);
      }
    }

    timer = setTimeout(step, SCROLL_DELAY * 1.5);
  }

  // ════════════════════════════════════════════════════════
  //  CLASS LOADING & SWITCHING
  // ════════════════════════════════════════════════════════
  function loadClass(idx) {
    const cls  = STANDINGS[idx];
    const body = document.getElementById('tbl-body');
    body.innerHTML = buildRows(cls.standings);
    body.style.transition = 'none';
    body.style.transform  = 'translateY(0)';
    scrollPos = 0;
    void body.offsetHeight; // force reflow
    body.style.transition  = 'transform 0.75s cubic-bezier(0.25, 0.46, 0.45, 0.94)';

    document.getElementById('tag-gt3').classList.toggle('active', idx === 0);
    document.getElementById('tag-hc').classList.toggle('active',  idx === 1);

    const count = cls.standings.length;
    document.getElementById('footer-info').textContent =
      `${cls.label} · ${count} Drivers`;

    startScroll(count);
  }

  function switchClass() {
    clearTimeout(timer);
    const veil = document.getElementById('veil');
    veil.classList.add('show');
    setTimeout(() => {
      classIdx = (classIdx + 1) % STANDINGS.length;
      loadClass(classIdx);
      setTimeout(() => veil.classList.remove('show'), 150);
    }, SWITCH_ANIM);
  }

  // ════════════════════════════════════════════════════════
  //  INIT
  // ════════════════════════════════════════════════════════
  document.addEventListener('DOMContentLoaded', () => loadClass(0));
  </script>

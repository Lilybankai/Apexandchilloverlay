<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Championship Standings — Apex &amp; Chill Racing League</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --cyan:    #00d4ff;
      --purple:  #b400ff;
      --magenta: #ff00c8;
      --gold:    #ffd700;
      --silver:  #b8c0cc;
      --bronze:  #cd7f32;
      --green:   #00ff88;
      --red:     #ff4455;
      --panel:   rgba(8, 8, 24, 0.98);
      --text:    #eaeaf5;
      --dim:     #556688;
      --row-alt: rgba(255,255,255,0.025);
      --border:  rgba(255,255,255,0.06);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
      font-family: 'Rajdhani', 'Arial', sans-serif;
    }

    /* ── SHELL ── */
    #overlay {
      position: absolute;
      inset: 0;
      background: var(--panel);
      border-radius: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    #hdr {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 52px;
      height: 112px;
      flex-shrink: 0;
      background: linear-gradient(90deg,
        rgba(0,212,255,0.07) 0%,
        rgba(180,0,255,0.03) 50%,
        rgba(255,0,200,0.07) 100%);
      border-bottom: 1px solid var(--border);
      position: relative;
    }

    #hdr::after {
      content: '';
      position: absolute;
      bottom: 0; left: 4%; right: 4%;
      height: 2px;
      background: linear-gradient(90deg,
        transparent, var(--cyan) 20%,
        var(--purple) 50%, var(--magenta) 80%, transparent);
      opacity: 0.55;
    }

    .brand-name {
      font-family: 'Orbitron', monospace;
      font-weight: 900;
      font-size: 27px;
      letter-spacing: 4px;
      background: linear-gradient(135deg, var(--cyan) 0%, var(--purple) 55%, var(--magenta) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-transform: uppercase;
    }

    .brand-sub {
      font-size: 12px;
      font-weight: 600;
      color: var(--dim);
      letter-spacing: 5px;
      text-transform: uppercase;
      margin-top: 5px;
    }

    .hdr-center { text-align: center; }

    .hdr-title {
      font-family: 'Orbitron', monospace;
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 7px;
      text-transform: uppercase;
    }

    .hdr-season {
      font-size: 13px;
      color: var(--dim);
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-top: 6px;
    }

    .hdr-right {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
    }

    .class-tag {
      padding: 9px 24px;
      border-radius: 25px;
      font-family: 'Orbitron', monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      border: 2px solid transparent;
      transition: all 0.6s ease;
      opacity: 0.3;
    }

    .class-tag.gt3      { color: var(--green); border-color: var(--green); }
    .class-tag.hypercar { color: var(--red);   border-color: var(--red); }

    .class-tag.active           { opacity: 1; }
    .class-tag.active.gt3       { background: rgba(0,255,136,0.12); box-shadow: 0 0 20px rgba(0,255,136,0.22); }
    .class-tag.active.hypercar  { background: rgba(255,68,85,0.12);  box-shadow: 0 0 20px rgba(255,68,85,0.22); }

    /* ── COLUMN HEADERS ── */
    #col-hdrs {
      display: grid;
      grid-template-columns: 76px 76px 1fr 300px 90px 90px 90px 112px;
      padding: 0 52px;
      height: 40px;
      align-items: center;
      flex-shrink: 0;
      background: rgba(0, 180, 255, 0.035);
      border-bottom: 1px solid var(--border);
    }

    .ch   { font-family: 'Orbitron', monospace; font-size: 10px; font-weight: 700; color: var(--dim); letter-spacing: 3px; text-transform: uppercase; }
    .ch.c { text-align: center; }
    .ch.r { text-align: right; }

    /* ── TABLE BODY ── */
    #tbl-wrap {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    #tbl-wrap::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 72px;
      background: linear-gradient(transparent, rgba(8,8,24,0.75));
      pointer-events: none;
      z-index: 2;
    }

    #tbl-body {
      position: absolute;
      top: 0; left: 0; right: 0;
      will-change: transform;
      transition: transform 0.75s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    /* ── DRIVER ROW ── */
    .row {
      display: grid;
      grid-template-columns: 76px 76px 1fr 300px 90px 90px 90px 112px;
      padding: 0 52px;
      height: 63px;
      align-items: center;
      border-bottom: 1px solid var(--border);
      position: relative;
    }

    .row::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
    }

    .row:nth-child(even) { background: var(--row-alt); }
    .row.p1 { background: rgba(255,215,0,0.055) !important; }
    .row.p2 { background: rgba(192,192,192,0.035) !important; }
    .row.p3 { background: rgba(205,127,50,0.035) !important; }
    .row.p1::before { background: var(--gold); }
    .row.p2::before { background: var(--silver); }
    .row.p3::before { background: rgba(205,127,50,0.9); }

    .pos-num {
      width: 42px; height: 42px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Orbitron', monospace;
      font-weight: 900; font-size: 17px;
      color: var(--text);
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.09);
    }
    .pos-num.g { background: rgba(255,215,0,0.18);  border-color: rgba(255,215,0,0.42);  color: var(--gold); }
    .pos-num.s { background: rgba(192,192,192,0.14); border-color: rgba(192,192,192,0.38); color: var(--silver); }
    .pos-num.b { background: rgba(205,127,50,0.14); border-color: rgba(205,127,50,0.38); color: var(--bronze); }

    .car-num {
      min-width: 50px; height: 33px; padding: 0 8px;
      border-radius: 5px;
      display: inline-flex; align-items: center; justify-content: center;
      font-family: 'Orbitron', monospace; font-weight: 700; font-size: 14px;
      background: rgba(0,212,255,0.08); border: 1px solid rgba(0,212,255,0.24); color: var(--cyan);
    }

    .driver-name {
      font-size: 21px; font-weight: 700; color: var(--text);
      letter-spacing: 0.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 14px;
    }

    .car-name {
      font-size: 14px; font-weight: 500; color: var(--dim);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 14px;
    }

    .rpt { text-align: center; font-family: 'Orbitron', monospace; font-size: 15px; font-weight: 700; color: var(--text); }
    .rpt.win    { color: var(--gold); }
    .rpt.podium { color: var(--silver); }
    .rpt.zero   { color: #3a3a58; }
    .rpt.dns    { font-size: 11px; letter-spacing: 1.5px; color: #445; font-weight: 600; }
    .rpt.dnf    { font-size: 11px; letter-spacing: 1.5px; color: #883333; font-weight: 600; }
    .rpt.none   { color: #2a2a3e; font-size: 20px; font-weight: 300; }

    .pts-val { font-family: 'Orbitron', monospace; font-size: 22px; font-weight: 900; color: var(--text); text-align: right; line-height: 1; }
    .pts-lbl { font-size: 11px; color: var(--dim); letter-spacing: 2px; text-transform: uppercase; text-align: right; }
    .row.p1 .pts-val { color: var(--gold); }
    .row.p2 .pts-val { color: var(--silver); }
    .row.p3 .pts-val { color: var(--bronze); }

    /* ── FOOTER ── */
    #footer {
      height: 46px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 52px;
      flex-shrink: 0;
      background: rgba(0,0,0,0.22);
      border-top: 1px solid var(--border);
    }

    .footer-brand { font-size: 12px; font-weight: 600; color: var(--dim); letter-spacing: 4px; text-transform: uppercase; }
    .footer-info  { font-family: 'Orbitron', monospace; font-size: 11px; color: var(--dim); letter-spacing: 3px; text-transform: uppercase; }

    /* ── PAUSED BADGE (subtle, shown in footer) ── */
    #pause-badge {
      font-family: 'Orbitron', monospace;
      font-size: 11px; font-weight: 700;
      color: rgba(255, 195, 0, 0.7);
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    #pause-badge.show { opacity: 1; }

    /* ── PROGRESS BAR ── */
    #progress-bar {
      position: absolute;
      bottom: 46px; left: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--cyan), var(--purple));
      z-index: 3;
      opacity: 0.45;
    }

    /* ── VEIL ── */
    #veil {
      position: absolute; inset: 0;
      background: var(--panel);
      opacity: 0; pointer-events: none; z-index: 50;
      transition: opacity 0.35s ease;
    }
    #veil.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="overlay">
    <div id="veil"></div>

    <!-- HEADER -->
    <div id="hdr">
      <div>
        <div class="brand-name">Apex &amp; Chill</div>
        <div class="brand-sub">Racing League</div>
      </div>
      <div class="hdr-center">
        <div class="hdr-title">Championship Standings</div>
        <div class="hdr-season" id="hdr-season">Season 1 &nbsp;·&nbsp; 3 Rounds Complete</div>
      </div>
      <div class="hdr-right" id="class-tags">
        <!-- populated dynamically from JSON -->
      </div>
    </div>

    <!-- COLUMN HEADERS -->
    <div id="col-hdrs">
      <div class="ch c">Pos</div>
      <div class="ch c">No.</div>
      <div class="ch">Driver</div>
      <div class="ch">Car</div>
      <div class="ch c">Rnd 1</div>
      <div class="ch c">Rnd 2</div>
      <div class="ch c">Rnd 3</div>
      <div class="ch r">Points</div>
    </div>

    <!-- TABLE -->
    <div id="tbl-wrap">
      <div id="tbl-body"></div>
      <div id="progress-bar" style="width:0%"></div>
    </div>

    <!-- FOOTER -->
    <div id="footer">
      <div class="footer-brand">Apex &amp; Chill Racing League &nbsp;·&nbsp; Season 1</div>
      <div class="footer-info" id="footer-info"></div>
      <div id="pause-badge">⏸ PAUSED</div>
    </div>
  </div>

  <script>
  // ── CONFIG ───────────────────────────────────────────────────────────────────
  const ROW_H        = 63;    // px — must match CSS .row height
  const SCROLL_DELAY = 2400;  // ms between each row-scroll step
  const BOTTOM_PAUSE = 4500;  // ms pause after reaching last row before class switch
  const SWITCH_ANIM  = 380;   // ms for veil fade

  // ── STATE ────────────────────────────────────────────────────────────────────
  let STANDINGS  = [];
  let classIdx   = 0;
  let scrollPos  = 0;
  let isPaused   = false;
  let timer      = null;
  let evtSource  = null;
  let reportTick = null;

  // ── DATA ─────────────────────────────────────────────────────────────────────
  async function fetchData() {
    try {
      const res = await fetch('/data/standings.json');
      STANDINGS = await res.json();
      buildClassTags();
      return true;
    } catch (e) {
      console.error('standings.json fetch failed:', e);
      return false;
    }
  }

  // Normalise class name to a short display label + tag CSS class
  function classInfo(raw) {
    const n = (raw || '').toLowerCase();
    if (n.includes('hypercar')) return { label: 'HYPERCAR', tag: 'hypercar' };
    return { label: 'LMGT3', tag: 'gt3' };
  }

  function buildClassTags() {
    const container = document.getElementById('class-tags');
    container.innerHTML = STANDINGS.map((cls, i) => {
      const { label, tag } = classInfo(cls.carClass);
      return `<div class="class-tag ${tag}${i === classIdx ? ' active' : ''}" data-idx="${i}">${label}</div>`;
    }).join('');
  }

  function updateClassTags() {
    document.querySelectorAll('.class-tag').forEach(el => {
      el.classList.toggle('active', parseInt(el.dataset.idx) === classIdx);
    });
  }

  // ── SSE ──────────────────────────────────────────────────────────────────────
  function connectSSE() {
    if (evtSource) { evtSource.close(); evtSource = null; }
    evtSource = new EventSource('/api/events');
    evtSource.onmessage = e => handleSSE(JSON.parse(e.data));
    evtSource.onerror   = () => setTimeout(connectSSE, 3000);
  }

  function handleSSE(msg) {
    if (msg.type === 'state') {
      // Initial sync from server — only apply if table is empty (fresh load)
      if (!document.querySelector('#tbl-body .row')) {
        classIdx = msg.classIdx || 0;
        isPaused = msg.paused  || false;
        if (STANDINGS.length) loadClass(classIdx);
      }
    } else if (msg.type === 'command') {
      switch (msg.cmd) {
        case 'pause':       doPause();               break;
        case 'resume':      doResume();              break;
        case 'switchClass': doSwitchClass(msg.idx);  break;
        case 'switchNext':  switchClass();           break;
        case 'resetTop':    doResetTop();            break;
        case 'reload':      doReload();              break;
      }
    }
  }

  // ── COMMANDS ─────────────────────────────────────────────────────────────────
  function doPause() {
    isPaused = true;
    clearTimeout(timer);
    document.getElementById('pause-badge').classList.add('show');
    // freeze progress bar at current width
    const pb = document.getElementById('progress-bar');
    pb.style.transition = 'none';
    reportState();
  }

  function doResume() {
    isPaused = false;
    document.getElementById('pause-badge').classList.remove('show');
    continueScroll();
    reportState();
  }

  function doResetTop() {
    scrollPos = 0;
    document.getElementById('tbl-body').style.transform = 'translateY(0)';
    if (!isPaused) continueScroll();
    reportState();
  }

  async function doReload() {
    const ok = await fetchData();
    if (ok) loadClass(classIdx);
  }

  function doSwitchClass(idx) {
    clearTimeout(timer);
    const veil = document.getElementById('veil');
    veil.classList.add('show');
    setTimeout(() => {
      classIdx = idx;
      loadClass(classIdx);
      setTimeout(() => veil.classList.remove('show'), 150);
    }, SWITCH_ANIM);
  }

  // ── STATE REPORTING (throttled) ───────────────────────────────────────────────
  function reportState() {
    clearTimeout(reportTick);
    reportTick = setTimeout(() => {
      fetch('/api/state', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ classIdx, paused: isPaused, scrollPos })
      }).catch(() => {});
    }, 400);
  }

  // ── HELPERS ──────────────────────────────────────────────────────────────────
  function raceCell(r) {
    if (!r || (r.position === null && r.dnf === null && r.dns === null))
      return '<div class="rpt none">–</div>';
    if (r.dns) return '<div class="rpt dns">DNS</div>';
    if (r.dnf) return '<div class="rpt dnf">DNF</div>';
    const pts = r.pointsTotal ?? 0;
    if (pts === 0) return '<div class="rpt zero">0</div>';
    const cls = pts >= 25 ? 'win' : pts >= 21 ? 'podium' : '';
    return `<div class="rpt ${cls}">${Math.round(pts)}</div>`;
  }

  function posClass(p)  { return p===1?'p1':p===2?'p2':p===3?'p3':''; }
  function posNumCls(p) { return p===1?'g' :p===2?'s' :p===3?'b' :''; }

  function buildRows(list) {
    return list.map(d => {
      const r = d.races || [];
      return `
        <div class="row ${posClass(d.position)}">
          <div><div class="pos-num ${posNumCls(d.position)}">${d.position}</div></div>
          <div><div class="car-num">${d.carNum}</div></div>
          <div class="driver-name">${d.id}</div>
          <div class="car-name">${(d.car || '').trim()}</div>
          ${raceCell(r[0])}
          ${raceCell(r[1])}
          ${raceCell(r[2])}
          <div>
            <div class="pts-val">${d.championshipPoints}</div>
            <div class="pts-lbl">pts</div>
          </div>
        </div>`;
    }).join('');
  }

  // ── SCROLL ───────────────────────────────────────────────────────────────────
  function continueScroll() {
    if (isPaused) return;
    clearTimeout(timer);

    const totalRows = STANDINGS[classIdx]?.standings?.length || 0;
    const wrapH     = document.getElementById('tbl-wrap').clientHeight;
    const visible   = Math.floor(wrapH / ROW_H);
    const maxStep   = Math.max(0, totalRows - visible);

    function step() {
      if (isPaused) return;
      if (scrollPos < maxStep) {
        scrollPos++;
        document.getElementById('tbl-body').style.transform =
          `translateY(-${scrollPos * ROW_H}px)`;
        reportState();
        timer = setTimeout(step, SCROLL_DELAY);
      } else {
        timer = setTimeout(() => { if (!isPaused) switchClass(); }, BOTTOM_PAUSE);
      }
    }

    timer = setTimeout(step, SCROLL_DELAY);
  }

  function startScroll(totalRows) {
    clearTimeout(timer);
    scrollPos = 0;

    const wrapH   = document.getElementById('tbl-wrap').clientHeight;
    const visible = Math.floor(wrapH / ROW_H);
    const maxStep = Math.max(0, totalRows - visible);
    const totalMs = maxStep * SCROLL_DELAY + BOTTOM_PAUSE;

    const pb = document.getElementById('progress-bar');
    pb.style.transition = 'none';
    pb.style.width = '0%';
    requestAnimationFrame(() => {
      if (!isPaused) {
        pb.style.transition = `width ${totalMs}ms linear`;
        pb.style.width = '100%';
      }
    });

    if (!isPaused) timer = setTimeout(continueScroll, SCROLL_DELAY * 1.5);
  }

  // ── CLASS LOADING & SWITCHING ─────────────────────────────────────────────────
  function loadClass(idx) {
    if (!STANDINGS.length) return;
    const cls = STANDINGS[idx];
    if (!cls) return;

    clearTimeout(timer);
    classIdx  = idx;
    scrollPos = 0;

    const body = document.getElementById('tbl-body');
    body.innerHTML = buildRows(cls.standings);
    body.style.transition = 'none';
    body.style.transform  = 'translateY(0)';
    void body.offsetHeight; // force reflow before re-enabling transition
    body.style.transition = 'transform 0.75s cubic-bezier(0.25, 0.46, 0.45, 0.94)';

    updateClassTags();

    const { label } = classInfo(cls.carClass);
    document.getElementById('footer-info').textContent =
      `${label} · ${cls.standings.length} Drivers`;

    reportState();
    startScroll(cls.standings.length);
  }

  function switchClass() {
    clearTimeout(timer);
    const veil = document.getElementById('veil');
    veil.classList.add('show');
    setTimeout(() => {
      classIdx = (classIdx + 1) % STANDINGS.length;
      loadClass(classIdx);
      setTimeout(() => veil.classList.remove('show'), 150);
    }, SWITCH_ANIM);
  }

  // ── INIT ─────────────────────────────────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', async () => {
    const ok = await fetchData();
    if (!ok) return;
    connectSSE();
    // Fallback: load class 0 if SSE hasn't triggered within 1.5s
    setTimeout(() => {
      if (!document.querySelector('#tbl-body .row')) loadClass(0);
    }, 1500);
  });
  </script>
</body>
</html>

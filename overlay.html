<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Championship Overlay — Apex &amp; Chill Racing League</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue: #20c9ff;
      --navy: #142f69;
      --orange: #ff8a00;
      --gold: #ffd700;
      --silver: #b8c0cc;
      --bronze: #cd7f32;
      --green: #00ff88;
      --panel: rgba(4, 10, 24, 0.96);
      --panel-deep: rgba(2, 6, 18, 0.96);
      --text: #edf4ff;
      --dim: #88a0c9;
      --row-alt: rgba(255, 255, 255, 0.022);
      --border: rgba(255, 255, 255, 0.09);
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
      font-family: 'Rajdhani', 'Arial', sans-serif;
    }
    #overlay {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% -5%, rgba(32, 201, 255, 0.14), transparent 36%),
        radial-gradient(circle at 84% 2%, rgba(255, 138, 0, 0.12), transparent 36%),
        linear-gradient(180deg, var(--panel) 0%, var(--panel-deep) 100%);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #hdr {
      display: grid;
      grid-template-columns: 420px 1fr 620px;
      align-items: center;
      padding: 0 42px;
      height: 122px;
      flex-shrink: 0;
      background: linear-gradient(90deg, rgba(32, 201, 255, 0.14), rgba(20, 47, 105, 0.2) 48%, rgba(255, 138, 0, 0.14));
      border-bottom: 1px solid var(--border);
      position: relative;
    }
    #hdr::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--blue), var(--orange), transparent);
      opacity: 0.8;
    }
    .hdr-left { display: flex; align-items: center; gap: 18px; min-width: 0; }
    .league-logo {
      width: 84px;
      height: 84px;
      object-fit: contain;
      border-radius: 14px;
      background: rgba(3, 9, 24, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 8px;
      box-shadow: 0 0 30px rgba(32, 201, 255, 0.2);
    }
    .brand-name {
      font-family: 'Orbitron', monospace;
      font-weight: 900;
      font-size: 25px;
      letter-spacing: 2px;
      color: var(--text);
      text-transform: uppercase;
      white-space: nowrap;
    }
    .brand-sub {
      font-size: 11px;
      font-weight: 700;
      color: var(--dim);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 6px;
    }
    .hdr-center { text-align: center; }
    .hdr-title {
      font-family: 'Orbitron', monospace;
      font-size: 21px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 5px;
      text-transform: uppercase;
    }
    .hdr-season { font-size: 13px; color: var(--dim); letter-spacing: 4px; text-transform: uppercase; margin-top: 6px; }
    .hdr-right { display: flex; justify-content: flex-end; align-items: center; gap: 14px; }
    .partner-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.04);
      min-width: 190px;
      height: 74px;
    }
    .partner-card.league { min-width: 235px; }
    .partner-logo {
      max-width: 150px;
      max-height: 52px;
      width: auto;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 12px rgba(10, 12, 18, 0.5));
    }
    .partner-meta { min-width: 0; }
    .partner-label {
      font-family: 'Orbitron', monospace;
      color: var(--dim);
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .partner-name {
      margin-top: 4px;
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .class-tag {
      padding: 7px 16px;
      border-radius: 20px;
      font-family: 'Orbitron', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      border: 1px solid var(--green);
      color: var(--green);
      opacity: 1;
      background: rgba(0, 255, 136, 0.09);
    }
    #views { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .view { display: none; flex: 1; flex-direction: column; overflow: hidden; }
    .view.active { display: flex; }
    #col-hdrs {
      display: grid;
      grid-template-columns: 76px 76px 1fr 90px 90px 90px 80px 112px;
      padding: 0 52px;
      height: 40px;
      align-items: center;
      flex-shrink: 0;
      background: rgba(32, 201, 255, 0.065);
      border-bottom: 1px solid var(--border);
    }
    .ch { font-family: 'Orbitron', monospace; font-size: 10px; font-weight: 700; color: var(--dim); letter-spacing: 3px; text-transform: uppercase; }
    .ch.c { text-align: center; }
    .ch.r { text-align: right; }
    #tbl-wrap { flex: 1; overflow: hidden; position: relative; }
    #tbl-body {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      will-change: transform;
      transition: transform 0.75s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .row {
      display: grid;
      grid-template-columns: 76px 76px 1fr 90px 90px 90px 80px 112px;
      padding: 0 52px;
      height: 63px;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .row:nth-child(even) { background: var(--row-alt); }
    .row.p1 { background: rgba(255, 215, 0, 0.055) !important; }
    .row.p2 { background: rgba(192, 192, 192, 0.035) !important; }
    .row.p3 { background: rgba(205, 127, 50, 0.035) !important; }
    .pos-num {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Orbitron', monospace;
      font-weight: 900;
      font-size: 17px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.09);
    }
    .car-num {
      min-width: 50px;
      height: 33px;
      padding: 0 8px;
      border-radius: 5px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: 'Orbitron', monospace;
      font-weight: 700;
      font-size: 14px;
      background: rgba(32, 201, 255, 0.11);
      border: 1px solid rgba(32, 201, 255, 0.35);
      color: var(--blue);
    }
    .driver-cell { min-width: 0; padding-right: 14px; }
    .driver-name { font-size: 22px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.15; }
    .car-name { font-size: 13px; font-weight: 500; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; margin-top: 2px; }
    .form-dots { display: flex; gap: 6px; margin-top: 5px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .dot.win { background: var(--gold); }
    .dot.pts { background: var(--blue); }
    .dot.none { background: #334; }
    .dot.blank { background: transparent; border: 1px solid #334; }
    .rpt { text-align: center; font-family: 'Orbitron', monospace; font-size: 15px; font-weight: 700; color: var(--text); }
    .rpt.zero { color: #3a3a58; }
    .rpt.dns, .rpt.dnf { font-size: 11px; letter-spacing: 1.5px; color: #445; }
    .rpt.none { color: #2a2a3e; font-size: 20px; font-weight: 300; }
    .gap-val { font-family: 'Orbitron', monospace; font-size: 16px; text-align: right; color: #91a2bf; }
    .gap-val.leader { color: var(--dim); }
    .pts-val { font-family: 'Orbitron', monospace; font-size: 22px; font-weight: 900; color: var(--text); text-align: right; line-height: 1; }
    .pts-lbl { font-size: 11px; color: var(--dim); letter-spacing: 2px; text-transform: uppercase; text-align: right; }
    #races-stage { flex: 1; padding: 30px 72px; display: flex; flex-direction: column; gap: 32px; }
    #schedule-stage { flex: 1; padding: 24px 60px; overflow: hidden; }
    .schedule-list { display: grid; gap: 10px; }
    .schedule-row {
      display: grid;
      grid-template-columns: 110px 1fr 320px 120px;
      gap: 14px;
      align-items: center;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.02);
    }
    .schedule-row.done { border-color: rgba(0, 255, 136, 0.35); }
    .schedule-row.next { border-color: rgba(0, 212, 255, 0.55); box-shadow: 0 0 18px rgba(0, 212, 255, 0.16); }
    .sched-round { font-family: 'Orbitron', monospace; font-size: 13px; color: var(--dim); letter-spacing: 2px; text-transform: uppercase; }
    .sched-name { font-size: 22px; color: var(--text); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sched-date { font-family: 'Orbitron', monospace; font-size: 12px; color: #91a2bf; letter-spacing: 1px; }
    .sched-status { font-family: 'Orbitron', monospace; font-size: 11px; text-align: right; letter-spacing: 2px; color: var(--dim); text-transform: uppercase; }
    .round-head { text-align: center; font-family: 'Orbitron', monospace; color: var(--text); opacity: 0; }
    .round-head.show { opacity: 1; transition: opacity 0.5s ease; }
    .round-title { font-size: 28px; letter-spacing: 4px; }
    .round-sub { font-size: 14px; color: var(--dim); letter-spacing: 3px; margin-top: 8px; }
    .podium-main { display: flex; justify-content: center; }
    .podium-bottom { display: flex; justify-content: center; gap: 42px; }
    .card {
      min-width: 460px;
      padding: 26px 30px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.03);
      opacity: 0;
    }
    .card.small { min-width: 380px; }
    .card-title { font-family: 'Orbitron', monospace; font-size: 15px; letter-spacing: 2px; color: var(--dim); text-transform: uppercase; }
    .card-driver { font-size: 40px; font-weight: 700; color: var(--text); line-height: 1.1; margin-top: 8px; }
    .card-meta { font-size: 18px; color: var(--dim); margin-top: 6px; }
    .card-pts { font-family: 'Orbitron', monospace; font-size: 22px; color: var(--blue); margin-top: 10px; }
    .reveal-right { animation: slideInRight 0.6s ease forwards; }
    .reveal-drop { animation: dropIn 0.7s ease forwards, goldPulse 2.2s ease-in-out infinite; }
    #footer {
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 52px;
      flex-shrink: 0;
      background: rgba(1, 5, 14, 0.7);
      border-top: 1px solid var(--border);
    }
    .footer-brand {
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 11px;
      font-weight: 600;
      color: var(--dim);
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .footer-affiliates { display: inline-flex; align-items: center; gap: 10px; }
    .affiliate-logo {
      width: auto;
      height: 22px;
      max-width: 110px;
      object-fit: contain;
      opacity: 0.88;
    }
    .footer-info { font-family: 'Orbitron', monospace; font-size: 11px; color: var(--dim); letter-spacing: 3px; text-transform: uppercase; }
    #pause-badge { font-family: 'Orbitron', monospace; font-size: 11px; font-weight: 700; color: rgba(255, 195, 0, 0.7); letter-spacing: 3px; text-transform: uppercase; opacity: 0; transition: opacity 0.3s ease; }
    #pause-badge.show { opacity: 1; }
    #progress-bar { position: absolute; bottom: 0; left: 0; height: 2px; background: linear-gradient(90deg, var(--blue), var(--orange)); z-index: 3; opacity: 0.6; }
    #veil { position: absolute; inset: 0; background: var(--panel); opacity: 0; pointer-events: none; z-index: 50; transition: opacity 0.35s ease; }
    #veil.show { opacity: 1; }
    @keyframes slideInRight { from { transform: translateX(120px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes dropIn { from { transform: translateY(-100px) scale(1.05); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes goldPulse { 0%, 100% { box-shadow: 0 0 30px rgba(255, 215, 0, 0.3); } 50% { box-shadow: 0 0 80px rgba(255, 215, 0, 0.7); } }
    #career-hdrs {
      display: grid;
      grid-template-columns: 76px 1fr 100px 100px 100px 100px 120px;
      padding: 0 52px;
      height: 40px;
      align-items: center;
      flex-shrink: 0;
      background: rgba(255, 138, 0, 0.07);
      border-bottom: 1px solid var(--border);
    }
    #career-wrap { flex: 1; overflow: hidden; position: relative; }
    #career-body {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      will-change: transform;
      transition: transform 0.75s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .career-row {
      display: grid;
      grid-template-columns: 76px 1fr 100px 100px 100px 100px 120px;
      padding: 0 52px;
      height: 63px;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .career-row:nth-child(even) { background: var(--row-alt); }
    .career-row.p1 { background: rgba(255, 215, 0, 0.055) !important; }
    .career-row.p2 { background: rgba(192, 192, 192, 0.035) !important; }
    .career-row.p3 { background: rgba(205, 127, 50, 0.035) !important; }
    .career-driver-name { font-size: 22px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 14px; }
    .career-stat { font-family: 'Orbitron', monospace; font-size: 18px; font-weight: 700; text-align: center; color: var(--text); }
    #career-progress-bar { position: absolute; bottom: 0; left: 0; height: 2px; background: linear-gradient(90deg, var(--orange), var(--blue)); z-index: 3; opacity: 0.6; }
  </style>
</head>
<body>
  <div id="overlay">
    <div id="veil"></div>
    <div id="hdr">
      <div class="hdr-left">
        <img class="league-logo" src="/download.jpg" alt="Apex and Chill League Logo">
        <div>
          <div class="brand-name">Apex &amp; Chill</div>
          <div class="brand-sub">Racing League Broadcast Overlay</div>
        </div>
      </div>
      <div class="hdr-center">
        <div class="hdr-title" id="hdr-title">Championship Standings</div>
        <div class="hdr-season" id="hdr-season">Season 1</div>
      </div>
      <div class="hdr-right">
        <div class="partner-card league">
          <img class="partner-logo" src="/Logo_Transparent-01_smaller.png" alt="League Partner">
          <div class="partner-meta">
            <div class="partner-label">League Partner</div>
            <div class="partner-name">SimEndurance</div>
          </div>
        </div>
        <div id="class-tags"></div>
      </div>
    </div>
    <div id="views">
      <div id="view-standings" class="view active">
        <div id="col-hdrs">
          <div class="ch c">Pos</div>
          <div class="ch c">No.</div>
          <div class="ch">Driver / Car</div>
          <div class="ch c">Rnd 1</div>
          <div class="ch c">Rnd 2</div>
          <div class="ch c">Rnd 3</div>
          <div class="ch r">Gap</div>
          <div class="ch r">Points</div>
        </div>
        <div id="tbl-wrap">
          <div id="tbl-body"></div>
          <div id="progress-bar" style="width:0%"></div>
        </div>
      </div>
      <div id="view-races" class="view">
        <div id="races-stage">
          <div class="round-head" id="round-head">
            <div class="round-title" id="round-title"></div>
            <div class="round-sub" id="round-sub"></div>
          </div>
          <div class="podium-main"><div class="card" id="card-p1"></div></div>
          <div class="podium-bottom">
            <div class="card small" id="card-p2"></div>
            <div class="card small" id="card-p3"></div>
          </div>
        </div>
      </div>
      <div id="view-schedule" class="view">
        <div id="schedule-stage">
          <div class="schedule-list" id="schedule-list"></div>
        </div>
      </div>
      <div id="view-career" class="view">
        <div id="career-hdrs">
          <div class="ch c">Pos</div>
          <div class="ch">Driver</div>
          <div class="ch c">Titles</div>
          <div class="ch c">Wins</div>
          <div class="ch c">Podiums</div>
          <div class="ch c">Pole wins</div>
          <div class="ch c">Pole top 3</div>
        </div>
        <div id="career-wrap">
          <div id="career-body"></div>
          <div id="career-progress-bar" style="width:0%"></div>
        </div>
      </div>
    </div>
    <div id="footer">
      <div class="footer-brand">
        <span>Apex &amp; Chill Racing League · Season 1</span>
        <span class="footer-affiliates">
          <img class="affiliate-logo" src="/download__4_-removebg-preview.png" alt="Affiliate Partner">
          <img class="affiliate-logo" src="/rogue%20energy-Photoroom.png" alt="Affiliate Partner">
        </span>
      </div>
      <div class="footer-info" id="footer-info"></div>
      <div id="pause-badge">⏸ PAUSED</div>
    </div>
  </div>
  <script src="/scripts/overlay/shared.js"></script>
  <script src="/scripts/overlay/standings.js"></script>
  <script src="/scripts/overlay/races.js"></script>
  <script src="/scripts/overlay/schedule.js"></script>
  <script src="/scripts/overlay/career.js"></script>
  <script src="/scripts/overlay/app.js"></script>
</body>
</html>

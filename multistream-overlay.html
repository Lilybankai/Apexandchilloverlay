<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Permissions-Policy" content="autoplay=*">
  <title>Multi-Stream Overlay — Apex &amp; Chill</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue: #20c9ff;
      --navy: #142f69;
      --orange: #ff8a00;
      --gold: #ffd700;
      --green: #00ff88;
      --purple: #b46bff;
      --yellow: #ffd23f;
      --panel: rgba(4, 10, 24, 0.96);
      --panel-deep: rgba(2, 6, 18, 0.96);
      --text: #edf4ff;
      --dim: #88a0c9;
      --border: rgba(255, 255, 255, 0.09);
      --lmu-w: 360px; /* reserved width for the live timing tower when active */
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
      font-family: 'Rajdhani', 'Arial', sans-serif;
    }

    /* ── Full overlay wrapper (matches existing overlay.html) ─────────────────── */
    #multistream-overlay {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% -5%, rgba(32, 201, 255, 0.14), transparent 36%),
        radial-gradient(circle at 84% 2%, rgba(255, 138, 0, 0.12), transparent 36%),
        linear-gradient(180deg, var(--panel) 0%, var(--panel-deep) 100%);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── Header (identical to overlay.html #hdr) ─────────────────────────────── */
    #hdr {
      display: grid;
      grid-template-columns: 420px 1fr 620px;
      align-items: center;
      padding: 0 42px;
      height: 122px;
      flex-shrink: 0;
      background: linear-gradient(90deg, rgba(32, 201, 255, 0.14), rgba(20, 47, 105, 0.2) 48%, rgba(255, 138, 0, 0.14));
      border-bottom: 1px solid var(--border);
      position: relative;
    }
    #hdr::after {
      content: '';
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--blue), var(--orange), transparent);
      opacity: 0.8;
    }
    .hdr-left { display: flex; align-items: center; gap: 18px; min-width: 0; }
    .league-logo {
      width: 84px; height: 84px;
      object-fit: contain;
      border-radius: 14px;
      background: rgba(3, 9, 24, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 8px;
      box-shadow: 0 0 30px rgba(32, 201, 255, 0.2);
    }
    .brand-name {
      font-family: 'Orbitron', monospace;
      font-weight: 900;
      font-size: 25px;
      letter-spacing: 2px;
      color: var(--text);
      text-transform: uppercase;
      white-space: nowrap;
    }
    .brand-sub {
      font-size: 11px;
      font-weight: 700;
      color: var(--dim);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 6px;
    }
    .hdr-center { text-align: center; }
    .hdr-title {
      font-family: 'Orbitron', monospace;
      font-size: 21px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 5px;
      text-transform: uppercase;
    }
    .hdr-season {
      font-size: 13px;
      color: var(--dim);
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-top: 6px;
    }
    .hdr-right { display: flex; justify-content: flex-end; align-items: center; gap: 14px; }
    .partner-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.04);
      min-width: 190px;
      height: 74px;
    }
    .partner-card.league { min-width: 235px; }
    .partner-logo {
      max-width: 150px;
      max-height: 52px;
      width: auto; height: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 12px rgba(10, 12, 18, 0.5));
    }
    .partner-meta { min-width: 0; }
    .partner-label {
      font-family: 'Orbitron', monospace;
      color: var(--dim);
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .partner-name {
      margin-top: 4px;
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    /* ── Stream grid area (fills remaining 958px below header) ────────────────── */
    #stream-area {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    #stream-grid {
      width: 1920px;
      height: 958px;
      transition: width 0.35s ease, margin-left 0.35s ease;
    }

    /* When the LMU tower is active, reserve its strip so streams shift right and
       shrink to fit rather than being covered. Scoped overrides win on specificity. */
    #multistream-overlay[data-lmu='1'] #stream-grid {
      margin-left: var(--lmu-w);
      width: calc(1920px - var(--lmu-w));
    }
    #multistream-overlay[data-lmu='1'][data-layout='grid'] #stream-grid,
    #multistream-overlay[data-lmu='1'][data-layout='dual'] #stream-grid {
      grid-template-columns: 1fr 1fr;
    }
    #multistream-overlay[data-lmu='1'][data-layout='pip'] #stream-grid {
      grid-template-columns: 2fr 1fr;
    }

    /* ── GRID LAYOUT (2×2 equal, 960×479) ───────────────────────────────────── */
    #multistream-overlay[data-layout='grid'] #stream-grid {
      display: grid;
      grid-template-columns: 960px 960px;
      grid-template-rows: 479px 479px;
    }

    #multistream-overlay[data-layout='grid'] .stream-cell {
      position: relative;
      overflow: hidden;
      background: #060614;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    /* ── DUAL LAYOUT (2×1 side-by-side, 960×958 — best fit for 16:9 streams) ── */
    #multistream-overlay[data-layout='dual'] #stream-grid {
      display: grid;
      grid-template-columns: 960px 960px;
      grid-template-rows: 958px;
    }

    #multistream-overlay[data-layout='dual'] .stream-cell {
      position: relative;
      overflow: hidden;
      background: #060614;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    #multistream-overlay[data-layout='dual'] .stream-cell:nth-child(n + 3) {
      display: none;
    }

    /* ── PiP LAYOUT (focused 1280×958 left, 3×(640×319) right) ─────────────── */
    #multistream-overlay[data-layout='pip'] #stream-grid {
      display: grid;
      grid-template-columns: 1280px 640px;
      grid-template-rows: 319px 320px 319px;
    }

    #multistream-overlay[data-layout='pip'] .stream-cell {
      position: relative;
      overflow: hidden;
      background: #060614;
    }

    #multistream-overlay[data-layout='pip'] .stream-cell.focused {
      grid-column: 1;
      grid-row: 1 / 4;
    }

    #multistream-overlay[data-layout='pip'] .stream-cell:not(.focused) {
      grid-column: 2;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    /* ── Common cell styles ──────────────────────────────────────────────────── */
    .stream-cell iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      transition: opacity 0.45s ease;
    }

    /* Focus glow border */
    .stream-cell.focused::after {
      content: '';
      position: absolute;
      inset: 0;
      border: 3px solid var(--blue);
      box-shadow: inset 0 0 24px rgba(32, 201, 255, 0.2), 0 0 12px rgba(32, 201, 255, 0.3);
      pointer-events: none;
      z-index: 10;
    }

    /* ── Stream meta (titles / stats from API) ───────────────────────────────── */
    .stream-meta-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 8;
      padding: 5px 8px 12px;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.82) 0%, rgba(0, 0, 0, 0.4) 60%, transparent 100%);
      pointer-events: none;
    }
    .stream-meta-bar .meta-title {
      font-family: 'Rajdhani', sans-serif;
      font-size: 11px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.25;
      max-height: 2.6em;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .stream-meta-bar .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 12px;
      margin-top: 3px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.4px;
      color: var(--dim);
      text-transform: uppercase;
    }
    .stream-meta-bar .meta-row span:empty { display: none; }

    /* ── Bottom scrolling ticker (control panel) ─────────────────────────────── */
    #ms-ticker {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 48px;
      z-index: 30;
      overflow: hidden;
      background: linear-gradient(90deg, rgba(4, 12, 28, 0.94), rgba(20, 47, 105, 0.9), rgba(4, 12, 28, 0.94));
      border-top: 1px solid rgba(255, 255, 255, 0.14);
      display: none;
      align-items: center;
    }
    #ms-ticker[data-visible='1'] { display: flex; }
    .ms-ticker-inner {
      display: inline-flex;
      white-space: nowrap;
      will-change: transform;
      animation: ms-ticker-scroll var(--ms-ticker-duration, 40s) linear infinite;
    }
    @keyframes ms-ticker-scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .ms-ticker-seg {
      font-family: 'Rajdhani', sans-serif;
      font-size: 20px;
      font-weight: 600;
      color: #edf4ff;
      letter-spacing: 0.6px;
      padding-right: 96px;
    }

    /* Stream label */
    .stream-label {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 6px 12px;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.72));
      font-family: 'Rajdhani', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: var(--dim);
      letter-spacing: 1px;
      text-transform: uppercase;
      z-index: 5;
      pointer-events: none;
    }

    /* Audio badge */
    .audio-badge {
      position: absolute;
      top: 10px; right: 10px;
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--blue);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 15;
      box-shadow: 0 0 12px rgba(32, 201, 255, 0.6);
    }
    .audio-badge svg { width: 14px; height: 14px; fill: #000; }

    /* Empty cell placeholder */
    .stream-cell.empty {
      background: #06060f;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .stream-cell.empty::before {
      content: '';
      width: 40px; height: 40px;
      border: 2px solid rgba(255, 255, 255, 0.07);
      border-radius: 50%;
    }

    /* Slot index corner label */
    .slot-index {
      position: absolute;
      top: 6px; left: 10px;
      font-family: 'Orbitron', monospace;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.12);
      letter-spacing: 2px;
      z-index: 5;
      pointer-events: none;
    }

    /* Twitch SDK embed container — fills the cell */
    .twitch-embed-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .twitch-embed-container iframe {
      width: 100% !important;
      height: 100% !important;
      border: none;
      display: block;
    }

    /* YouTube IFrame API container — fills the cell */
    .yt-embed-container {
      position: absolute;
      inset: 0;
      transition: opacity 0.45s ease;
    }
    .yt-embed-container iframe {
      width: 100% !important;
      height: 100% !important;
      border: none;
      display: block;
    }

    /* ── LMU live timing tower (left edge, overlaid) ──────────────────────────── */
    #lmu-tower {
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: var(--lmu-w);
      z-index: 20;
      display: none;
      flex-direction: column;
      padding: 10px 10px 60px;
      background: linear-gradient(90deg, var(--panel-deep) 0%, rgba(2, 6, 18, 0.92) 78%, transparent 100%);
      border-right: 1px solid var(--border);
      font-family: 'Rajdhani', sans-serif;
      overflow: hidden;
      pointer-events: none;
    }
    #lmu-tower[data-visible='1'] { display: flex; }

    .lmu-session {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 8px 10px;
      margin-bottom: 10px;
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.6px;
      color: var(--text);
    }
    .lmu-session .ls-type { font-family: 'Orbitron', monospace; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }
    .lmu-session .ls-flag {
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--green); box-shadow: 0 0 8px var(--green);
    }
    .lmu-session .ls-flag.yellow { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
    .lmu-session .ls-flag.sc, .lmu-session .ls-flag.red { background: var(--orange); box-shadow: 0 0 8px var(--orange); }
    .lmu-session .ls-dim { color: var(--dim); font-size: 12px; letter-spacing: 1px; }

    .lmu-class { margin-bottom: 10px; }
    .lmu-class-hdr {
      font-family: 'Orbitron', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #03101f;
      padding: 4px 10px;
      border-radius: 6px 6px 0 0;
      background: linear-gradient(90deg, var(--blue), rgba(32, 201, 255, 0.35));
    }
    .lmu-class[data-cls='LMGT3'] .lmu-class-hdr { background: linear-gradient(90deg, var(--orange), rgba(255, 138, 0, 0.35)); }

    .lmu-row {
      display: grid;
      grid-template-columns: 20px 26px 1fr 40px 50px 54px;
      align-items: center;
      gap: 5px;
      height: 32px;
      padding: 0 7px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      background: rgba(6, 12, 28, 0.55);
      transition: transform 0.4s ease, background 0.3s ease;
    }
    #lmu-tower.compact .lmu-row { height: 26px; }
    #lmu-tower.compact .lmu-drv { font-size: 12px; }
    .lmu-row:last-child { border-radius: 0 0 6px 6px; }
    .lmu-pos { font-family: 'Orbitron', monospace; font-size: 13px; font-weight: 700; color: var(--text); text-align: center; }
    .lmu-num {
      font-family: 'Orbitron', monospace; font-size: 11px; font-weight: 700;
      color: var(--blue); text-align: center;
      border: 1px solid rgba(32, 201, 255, 0.4); border-radius: 4px; padding: 1px 0;
    }
    .lmu-row[data-cls='LMGT3'] .lmu-num { color: var(--orange); border-color: rgba(255, 138, 0, 0.4); }
    .lmu-drv { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: 0.2px; }
    .lmu-sectors { display: flex; gap: 3px; justify-content: center; }
    .lmu-sec { width: 10px; height: 12px; border-radius: 2px; background: rgba(255, 255, 255, 0.12); }
    .lmu-sec.purple { background: var(--purple); box-shadow: 0 0 6px rgba(180, 107, 255, 0.7); }
    .lmu-sec.green { background: var(--green); }
    .lmu-sec.yellow { background: var(--yellow); }
    .lmu-last { font-family: 'Orbitron', monospace; font-size: 11px; color: var(--dim); text-align: right; }
    .lmu-gap { font-family: 'Orbitron', monospace; font-size: 12px; font-weight: 600; color: var(--text); text-align: right; }
    .lmu-gap.leader { color: var(--gold); }

    .lmu-pit {
      font-family: 'Orbitron', monospace; font-size: 9px; font-weight: 700; letter-spacing: 1px;
      color: #03101f; background: var(--orange); border-radius: 3px; padding: 1px 4px; text-align: center;
    }

    /* Battle highlight — pulsing orange edge */
    .lmu-row.battle { background: rgba(255, 138, 0, 0.14); box-shadow: inset 3px 0 0 var(--orange); }
    .lmu-row.battle .lmu-gap { color: var(--orange); animation: lmu-battle-pulse 1.1s ease-in-out infinite; }
    @keyframes lmu-battle-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

    /* Overtake call-out (lower third, sits above the ticker) */
    #lmu-callout {
      position: absolute;
      left: 12px; bottom: 60px;
      z-index: 31;
      display: none;
      align-items: center;
      gap: 12px;
      padding: 10px 18px;
      border-radius: 10px;
      background: linear-gradient(90deg, rgba(255, 138, 0, 0.96), rgba(20, 47, 105, 0.94));
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 6px 26px rgba(0, 0, 0, 0.5);
      font-family: 'Rajdhani', sans-serif;
      transform: translateX(-120%);
      transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    #lmu-callout[data-visible='1'] { display: flex; transform: translateX(0); }
    #lmu-callout .co-move { font-family: 'Orbitron', monospace; font-size: 18px; font-weight: 900; color: #fff; letter-spacing: 1px; }
    #lmu-callout .co-name { font-size: 19px; font-weight: 700; color: #fff; letter-spacing: 0.5px; }
    #lmu-callout .co-cls { font-family: 'Orbitron', monospace; font-size: 11px; letter-spacing: 2px; color: rgba(255, 255, 255, 0.8); text-transform: uppercase; }
  </style>
</head>
<body>
  <div id="multistream-overlay" data-layout="grid">

    <!-- Header — identical branding to Championship Overlay -->
    <div id="hdr">
      <div class="hdr-left">
        <img class="league-logo" src="/download.jpg" alt="Apex and Chill League Logo">
        <div>
          <div class="brand-name">Apex &amp; Chill</div>
          <div class="brand-sub">Racing League Broadcast Overlay</div>
        </div>
      </div>
      <div class="hdr-center">
        <div class="hdr-title">Live Stream Grid</div>
        <div class="hdr-season">Multi-Stream Broadcast</div>
      </div>
      <div class="hdr-right">
        <div class="partner-card league">
          <img class="partner-logo" src="/Logo_Transparent-01_smaller.png" alt="League Partner">
          <div class="partner-meta">
            <div class="partner-label">League Partner</div>
            <div class="partner-name">SimEndurance</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Stream grid -->
    <div id="stream-area">
      <div id="stream-grid">
        <div class="stream-cell empty" id="cell-0">
          <span class="slot-index">01</span>
          <div class="audio-badge">
            <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
          </div>
          <div class="stream-label"></div>
        </div>
        <div class="stream-cell empty" id="cell-1">
          <span class="slot-index">02</span>
          <div class="audio-badge">
            <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
          </div>
          <div class="stream-label"></div>
        </div>
        <div class="stream-cell empty" id="cell-2">
          <span class="slot-index">03</span>
          <div class="audio-badge">
            <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
          </div>
          <div class="stream-label"></div>
        </div>
        <div class="stream-cell empty" id="cell-3">
          <span class="slot-index">04</span>
          <div class="audio-badge">
            <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
          </div>
          <div class="stream-label"></div>
        </div>
      </div>

      <!-- LMU live timing tower — overlaid on the left edge; auto-shown when armed + session live -->
      <div id="lmu-tower" data-visible="0" aria-hidden="true">
        <div class="lmu-session" id="lmu-session"></div>
        <div id="lmu-classes"></div>
      </div>

      <!-- Overtake call-out (lower third) -->
      <div id="lmu-callout" data-visible="0" aria-hidden="true">
        <span class="co-move"></span>
        <div>
          <div class="co-name"></div>
          <div class="co-cls"></div>
        </div>
      </div>
    </div>

    <div id="ms-ticker" class="ms-ticker" data-visible="0" aria-hidden="true">
      <div class="ms-ticker-inner">
        <span class="ms-ticker-seg"></span><span class="ms-ticker-seg"></span>
      </div>
    </div>

  </div>
  <!-- Hidden container keeps Twitch embeds alive while rotated off-screen -->
  <div id="twitch-park" style="position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;pointer-events:none;"></div>
  <script>
    // OBS browser sources render into an offscreen CEF buffer. Two browser APIs
    // return incorrect values in that mode, both of which the Twitch embed SDK
    // uses for its autoplay eligibility checks:
    //
    // 1. getBoundingClientRect() → always {width:0,height:0} (no real viewport).
    //    Twitch uses this for its "style visibility" (dimension) check.
    //    Fix: fall back to offsetWidth/offsetHeight which use CSS layout values.
    //
    // 2. IntersectionObserver → never fires, or fires with intersectionRatio 0,
    //    because there is no visual viewport to intersect against.
    //    Twitch uses this for its "viewport visibility" check via maybePlay().
    //    Fix: proactively fire the callback with isIntersecting:true for any
    //    element that has real CSS layout dimensions.
    (function () {
      // ── Page Visibility API patch ───────────────────────────────────────────
      // OBS browser sources render offscreen, so document.hidden = true and
      // visibilityState = 'hidden'. Both the Twitch and YouTube SDKs check
      // these to decide whether to autoplay. Override so they always see the
      // page as visible.
      Object.defineProperty(document, 'hidden', { get: function () { return false; } });
      Object.defineProperty(document, 'visibilityState', { get: function () { return 'visible'; } });
      // Suppress visibilitychange events that OBS fires — prevents SDKs from
      // pausing playback when CEF reports the page as background.
      document.addEventListener('visibilitychange', function (e) {
        e.stopImmediatePropagation();
      }, true);

      // ── getBoundingClientRect patch ─────────────────────────────────────────
      var _bcr = Element.prototype.getBoundingClientRect;
      Element.prototype.getBoundingClientRect = function () {
        var r = _bcr.call(this);
        if (r.width === 0 && r.height === 0 &&
            (this.offsetWidth > 0 || this.offsetHeight > 0)) {
          var w = this.offsetWidth, h = this.offsetHeight;
          return { width: w, height: h, top: 0, left: 0,
                   right: w, bottom: h, x: 0, y: 0,
                   toJSON: function () {
                     return { width: w, height: h, top: 0, left: 0,
                              right: w, bottom: h, x: 0, y: 0 };

      // ── IntersectionObserver patch ──────────────────────────────────────────
      var _IO = window.IntersectionObserver;
      if (!_IO) return;

                       time: e.time, rootBounds: e.rootBounds,
                       boundingClientRect: { width:w,height:h,top:0,left:0,right:w,bottom:h,x:0,y:0 },
                       intersectionRect:   { width:w,height:h,top:0,left:0,right:w,bottom:h,x:0,y:0 } };
            }

          }), io);
        }, opts);

        var _obs = io.observe.bind(io);
        io.observe = function (el) {
          _obs(el);
          // Also fire immediately — OBS's offscreen IO may never trigger at all
          requestAnimationFrame(function () {
            var w = el.offsetWidth, h = el.offsetHeight;
            if (w > 0 || h > 0) {
              cb([{ isIntersecting: true, intersectionRatio: 1, target: el,
                    time: performance.now(), rootBounds: null,
                    boundingClientRect: { width:w,height:h,top:0,left:0,right:w,bottom:h,x:0,y:0 },
                    intersectionRect:   { width:w,height:h,top:0,left:0,right:w,bottom:h,x:0,y:0 } }],
                 io);
            }

        };
        return io;
      };
      window.IntersectionObserver.prototype = _IO.prototype;
    })();
